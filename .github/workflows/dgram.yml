name: Dgram Debug Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;37.0.0 ndk;27.3.13750724 platforms;android-37.0 cmake;3.22.1"
      - name: Configure
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties
          echo "apiId=${{ secrets.API_ID }}" >> local.properties
          echo "apiHash=${{ secrets.API_HASH }}" >> local.properties
          echo "mapsApiKey=dummy" >> local.properties
          echo "sentryDsn=" >> local.properties
          echo "helperBotId=0" >> local.properties
          echo "helperBotUsername=none" >> local.properties
          cat > TMessagesProj_App/google-services.json << 'JSON'
          {"project_info":{"project_number":"123456789012","project_id":"dgram-dummy"},
          "client":[
          {"client_info":{"mobilesdk_app_id":"1:123456789012:android:0000000000000000","android_client_info":{"package_name":"com.dnd.dgram"}},"api_key":[{"current_key":"dummy"}]},
          {"client_info":{"mobilesdk_app_id":"1:123456789012:android:1111111111111111","android_client_info":{"package_name":"com.dnd.dgram.beta"}},"api_key":[{"current_key":"dummy"}]}],
          "configuration_version":"1"}
          JSON
      - name: Configure Signing
        run: |
          echo "storeFile=${{ github.workspace }}/keystore.jks" >> local.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties
          echo "${{ secrets.KEYSTORE_JKS }}" | base64 --decode > keystore.jks
      - name: Build
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          path: TMessagesProj_App/build/outputs/apk/debug/*-armeabi-v7a.apk
          archive: false
